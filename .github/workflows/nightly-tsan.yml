name: Nightly TSan

# ThreadSanitizer over the full package suite. The suite has a documented
# history of concurrency bugs surfacing as stalls (Scripts/TEST-STALL-FIX.md);
# TSan turns the next race into a deterministic nightly failure instead.
# Deliberately NOT in PR CI: TSan slows execution ~5-15x.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

concurrency:
  group: nightly-tsan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tsan:
    name: swift test --sanitize=thread
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Restore vendored libghostty build
        id: vendor-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: Vendor/Ghostty/build
          key: ghostty-build-${{ hashFiles('Vendor/Ghostty/commit.txt') }}
      - name: Provision vendored libghostty (script bootstraps zig itself)
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: ./Scripts/build-ghostty-xcframework.sh
      - name: Verify vendored artifacts are present
        run: |
          test -f Vendor/Ghostty/build/lib/libghostty-internal.a
          test -f Vendor/Ghostty/build/include/ghostty.h
      - name: Test under ThreadSanitizer (serial — TSan + parallel xctest processes multiply noise)
        working-directory: Packages
        run: swift test --sanitize=thread
