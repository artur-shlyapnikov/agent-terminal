# Codex screen detection manifest (architecture §3.7).
# Conservative: ambiguity → unknown; approvals are terminalOnly, never auto-answered.

manifestVersion = 1
agentKind = "codex"
adapterVersionRange = ">=0.1 <2.0"
foregroundExecutables = ["codex", "node"]
snapshotRows = 32
fallback = "unknown"

[[rules]]
id = "approval-prompt"
resultingLifecycle = "waitingForInput"
priority = 100
requestKind = "approval"
stabilityMilliseconds = 150
anyMatchers = [
  { kind = "regex", pattern = "Allow (command|execution)\\?", region = "lastLines", lines = 5 },
  { kind = "regex", pattern = "^(Allow|Approve|Reject|Cancel)\\s*\\[", region = "lastLines", lines = 5 },
]
noneMatchers = [
  { kind = "literal", pattern = "cancelled", region = "wholeSnapshot" },
]

[[rules]]
id = "plan-approval"
resultingLifecycle = "waitingForInput"
priority = 100
requestKind = "selection"
stabilityMilliseconds = 150
allMatchers = [
  { kind = "literal", pattern = "Approve plan?", region = "lastLines", lines = 6 },
]

[[rules]]
id = "codex-working"
resultingLifecycle = "working"
priority = 50
anyMatchers = [
  { kind = "regex", pattern = "(^|\\s)(thinking|working|running)…?$", region = "lastLine" },
  { kind = "regex", pattern = "^\\s*[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]", region = "lastLine" },
]

[[rules]]
id = "codex-idle"
resultingLifecycle = "idle"
priority = 10
stabilityMilliseconds = 400
allMatchers = [
  { kind = "literal", pattern = "›", region = "lastLine" },
]
noneMatchers = [
  { kind = "literal", pattern = "Allow", region = "lastLines", lines = 4 },
]
